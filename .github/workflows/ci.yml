name: CI

on:
  push:
    branches: [ main ]   # repo-cleanup pode sair
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    name: Smoke (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install only test tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Install package without dependencies (fast)
        run: pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check .

      - name: Run smoke tests
        run: pytest -q

  full:
    name: Tests (full deps)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: smoke
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project with deps (may be heavy)
        run: |
          python -m pip install --upgrade pip
          # se tiver requirements, ok; se não, ignora
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements_macos.txt ]; then pip install -r requirements_macos.txt || true; fi
          pip install -e .[dev] || pip install -e .

      - name: Type check (mypy on analyz)
        run: |
          pip install mypy
          mypy analyz || true   # relaxado até você querer endurecer

      - name: Run full tests
        run: pytest -q

