[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analyz"
version = "0.1.0"
description = "AnaliZ - análise técnica, backtest e estratégias"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Wesley Maximiliano Braga", email = "wmaxib@yahoo.com.br" }]
license = { text = "All Rights Reserved" }

# Deps básicas — mantenha leves. (As pesadas você pode instalar à parte quando precisar)
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "black>=24.0",
]

# Diga ao setuptools para procurar pacotes só aqui
[tool.setuptools]
package-dir = {"" = "."}

# **RESTRIÇÃO CRÍTICA**: empacotar SOMENTE analyz/ (e submódulos)
[tool.setuptools.packages.find]
where = ["."]
include = ["analyz", "analyz.*"]
exclude = [
  "tests*", "docs*",
  "models*", "modelos*", "modelos_lstm*", "resultados_lstm*", "previsoes_prophet*",
  "samples*", "static*", "templates*", "source*",
  "dados*", "reports*", "relatorios*", "logs_*", "analiZ*",
  "chatbot_env*", "botenv*", "botenv311*"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
